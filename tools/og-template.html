<!doctype html>

<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Newsreader'; src: url('FONT_DISPLAY'); font-weight: 200 800; }
  @font-face { font-family: 'Geist'; src: url('FONT_BODY'); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #ffffff; padding: 18px; font-family: 'Geist'; }
  .sheet { position: relative; width: 100%; height: 100%; background: #f4f6fb; overflow: hidden; }
  .copy { position: absolute; left: 76px; top: 110px; width: 640px; }
  .label { font-size: 17px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: #111a3a; display: flex; align-items: center; gap: 14px; }
  .label i { width: 12px; height: 12px; border-radius: 50%; background: #3b37e3; display: block; }
  h1 { margin-top: 28px; font-family: 'Newsreader'; font-weight: 400; font-size: 118px; line-height: 1; letter-spacing: -0.02em; color: #111a3a; }
  h1 b { font-weight: 700; }
  .dot { color: #e8531f; }
  .rule { width: 90px; height: 4px; border-radius: 4px; background: #e8531f; margin: 34px 0 30px; }
  p { font-family: 'Newsreader'; font-size: 34px; line-height: 1.35; color: #111a3a; }
  p b { font-weight: 700; }
  .photo { position: absolute; right: 90px; top: 78px; width: 330px; height: 412px; }
  .hatch { position: absolute; inset: 20px -20px -20px 20px; border-radius: 16px; background-image: repeating-linear-gradient(-45deg, #d9dffb 0 3px, transparent 3px 11px); }
  .frame { position: absolute; inset: 0; border-radius: 16px; border: 3px solid #111a3a; overflow: hidden; background: #d9dffb; }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dots { position: absolute; left: -44px; top: -44px; width: 130px; height: 130px; background-image: radial-gradient(#d9dffb 2.4px, transparent 2.7px); background-size: 16px 16px; }
  .site { position: absolute; right: 90px; bottom: 44px; font-size: 18px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #3b37e3; }
</style>
</head>
<body>
  <div class="sheet">
    <div class="copy">
      <div class="label"><i></i>PILL_TEXT</div>
      <h1>Hi, I'm <b>FIRST_NAME</b><span class="dot">.</span></h1>
      <div class="rule"></div>
      <p>A <b>developer and co-founder</b> who also works in sales.</p>
    </div>
    <div class="photo">
      <div class="dots"></div>
      <div class="hatch"></div>
      <div class="frame"><img src="PHOTO_URL" alt="" /></div>
    </div>
    <div class="site">aathii.github.io</div>
  </div>
</body>
